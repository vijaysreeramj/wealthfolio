[project]
name = "wealthfolio-server"
version = "0.1.0"
description = "Wealthfolio API - personal finance tracker for India"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-dateutil>=2.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
